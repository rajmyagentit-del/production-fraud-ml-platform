project:
  name: production-fraud-ml-platform
  version: "0.1.0"

data:
  raw_path: data/raw/transactions.csv
  processed_path: data/processed/transactions.parquet

training:
  test_size: 0.2
  random_state: 42

model:
  name: xgboost
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8

mlflow:
  experiment_name: production-fraud-ml-platform
